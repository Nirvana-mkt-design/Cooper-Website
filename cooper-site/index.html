<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicons. All of these — plus images/cooper-icon-large.png, which backs
      the Organization logo below, and /icon-192.png and /icon-512.png
      referenced from /site.webmanifest — are generated from
      frontend/public/cooper-icon.svg, the icon the product itself ships:
      the Cooper mark in white on the orange tile. Regenerate them from that
      file so the two stay in step.

      The mark on its own is a thin dark outline that closes up at 16px, and
      the set this replaced was a cream tile with no mark on it at all, which
      is what Google was drawing in search results. Keep them square —
      Google picks the search-result icon from here and wants a square at a
      multiple of 48px.

      /favicon.ico earns its place despite modern browsers preferring the
      SVG: browsers and crawlers request it blind, ignoring the <link>, and
      with no file on disk the SPA fallback answers with the index.html shell
      at 200 and clients cache HTML as an icon.

      The PNGs are here for Safari, which drew a blank tile without them. It
      does not reliably take an SVG favicon, and every entry inside our .ico is
      PNG-compressed rather than BMP, which Safari also handles badly — so it
      had nothing left to fall back to. A plain PNG it does take, and Chrome
      and Firefox still prefer the SVG below. Regenerate them from favicon.svg
      with `node scripts/favicons/generate.cjs`.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO / structured data
      ----------------------
      CANONICAL DOMAIN: everything below points at https://www.askcooper.ai.
      If the production domain is different, replace every occurrence of
      "https://www.askcooper.ai" here AND in /public/robots.txt. sitemap.xml is
      generated by scripts/prerender.cjs — override SITE_ORIGIN there instead.
    -->
    <title>Cooper: AI for Insurance Professionals</title>
    <!-- Description below is COOPER_DESCRIPTION from src/lib/site.ts — keep both
         copies (here and in the Organization JSON-LD) in sync with it. -->

      name="description"
      content="Cooper is your AI coworker for the entire insurance workflow from intake to renewal. It automates submissions, renewals, coverage checks, certificates, and reporting for agencies, brokers, MGAs, insurers, and claims TPAs."
    />
    <link rel="canonical" href="https://www.askcooper.ai/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#1a1a1a" />

    <!-- Open Graph (link previews on LinkedIn, Slack, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cooper" />
    <meta property="og:title" content="Cooper: AI for Insurance Professionals" />
    <meta
      property="og:description"
      content="Cooper is your AI coworker for the entire insurance workflow from intake to renewal."
    />
    <meta property="og:url" content="https://www.askcooper.ai/" />
    <meta property="og:image" content="https://www.askcooper.ai/images/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cooper: AI for Insurance Professionals" />
    <meta
      name="twitter:description"
      content="Cooper is your AI coworker for the entire insurance workflow from intake to renewal."
    />
    <meta name="twitter:image" content="https://www.askcooper.ai/images/og-default.jpg" />

    <!--
      JSON-LD structured data. Powers the Google knowledge panel (Organization)
      and gives Google the site's primary navigation as sitelink candidates
      (SiteNavigationElement). Sitelinks are ultimately chosen by Google, but
      strong structured data + a sitemap make Cooper's sub-pages the obvious
      candidates.

      `sameAs` lists Cooper's verified social profiles — Google uses these to
      link the Organization to those profiles in the knowledge panel. Only add
      profiles that are unambiguously ours; do not guess.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.askcooper.ai/#organization",
            "name": "Cooper",
            "url": "https://www.askcooper.ai/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.askcooper.ai/images/cooper-icon-large.png"
            },
            "image": "https://www.askcooper.ai/images/cooper-icon-large.png",
            "description": "Cooper is your AI coworker for the entire insurance workflow from intake to renewal. It automates submissions, renewals, coverage checks, certificates, and reporting for agencies, brokers, MGAs, insurers, and claims TPAs.",
            "slogan": "Your AI coworker for the entire insurance workflow, from intake to renewal.",
            "sameAs": [
              "https://www.linkedin.com/company/cooperai"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.askcooper.ai/#website",
            "url": "https://www.askcooper.ai/",
            "name": "Cooper",
            "description": "Your AI coworker for the entire insurance workflow, from intake to renewal.",
            "publisher": { "@id": "https://www.askcooper.ai/#organization" }
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Retail Agencies",
            "description": "Cooper for retail agencies: producers sell, account managers serve, Cooper does the rest.",
            "url": "https://www.askcooper.ai/product/retail-agencies"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Wholesale Brokers",
            "description": "Cooper for wholesale brokers: place more business faster with intelligent matching.",
            "url": "https://www.askcooper.ai/product/wholesale-brokers"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "MGAs & Insurers",
            "description": "Cooper for MGAs and insurers: scale underwriting without scaling headcount.",
            "url": "https://www.askcooper.ai/product/mgas-insurers"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Claims TPAs",
            "description": "Cooper for claims TPAs: streamline claims from intake to reporting.",
            "url": "https://www.askcooper.ai/product/claims-tpas"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "About",
            "description": "Our mission, team, and why we're building Cooper for insurance.",
            "url": "https://www.askcooper.ai/about"
          },
          {
            "@type": "SiteNavigationElement",
            "name": "Request a Demo",
            "description": "See Cooper in action with your own data.",
            "url": "https://www.askcooper.ai/demo"
          }
        ]
      }
    </script>

    <!-- Fonts are self-hosted (see src/index.css @font-face). Preload the three
         faces used above the fold so text renders in the right font on first
         paint instead of after a swap. -->
    <link rel="preload" href="/fonts/biz-udpmincho-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- ANALYTICS:START — stripped from non-production builds by the
         strip-analytics plugin in vite.config.ts (prod builds only). -->
    <!-- GTM is injected by script, so the preload scanner can't discover it;
         Cookiebot needs no hint (its script tag below is scanner-visible). -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <!-- Google tag stub + Consent Mode v2 defaults. Must run before Cookiebot:
         uc.js looks for an existing consent default and layers
         gtag('consent','update',…) on top of it when the visitor chooses. The
         synchronous stub also keeps window.gtag available to the app's
         conversion hooks from t=0. -->
    <script data-cookieconsent="ignore">
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){dataLayer.push(arguments);}
      // wait_for_update must outlast Cookiebot's async load, or the first
      // pings go out consent-denied and lose the ad-click attribution.
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 2000
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      gtag('js', new Date());
      gtag('config', 'AW-18264278460');
    </script>
    <!-- Cookiebot — async so the consent banner doesn't block first paint.
         Auto-blocking still rewrites known static trackers (the Meta pixel
         below), but it must NOT block the Google tag scripts: they carry
         data-cookieconsent="ignore" because Consent Mode governs them instead
         — denied → cookieless pings only, granted → Cookiebot pushes
         gtag('consent','update',…) and the tags run normally. -->
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="9ee90567-df2f-4c70-a946-cda2f21be9b4" data-blockingmode="auto" type="text/javascript" async></script>
    <!-- End Cookiebot -->

    <!-- Google Tag Manager + Google Ads + OpenAI pixel.
         The tag scripts (~340 KB of JS) load on window load: on a 4G phone
         they otherwise compete with the hero for bandwidth and dominate
         main-thread blocking time. Conversions fire on the demo form, long
         after load, so nothing meaningful is lost. The data-cookieconsent
         attribute must be set before src so Cookiebot's auto-blocking hooks
         see it when the element is inserted. -->
    <script data-cookieconsent="ignore">
      window.addEventListener('load', function () {
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;
        j.setAttribute('data-cookieconsent','ignore');j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-MR7M6SRR');
        var ads = document.createElement('script');
        ads.async = true;
        ads.setAttribute('data-cookieconsent', 'ignore');
        ads.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18264278460';
        document.head.appendChild(ads);
        var oai = document.createElement('script');
        oai.async = true;
        oai.src = 'https://bzrcdn.openai.com/sdk/oaiq.min.js';
        document.head.appendChild(oai);
      });
    </script>
    <!-- End Google Tag Manager + Google Ads + OpenAI pixel -->

    <meta name="facebook-domain-verification" content="qnfhkfn3ezlz835mbzdk08c7mnz22x" />

    <!-- Meta Pixel — blocked by Cookiebot until marketing consent is given -->
    <script data-cookieconsent="marketing">
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
      document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1324566372535026');
      // Attach a per-pageview eventID so Meta can dedupe this browser PageView
      // against the same event relayed server-side by the Conversions API
      // Gateway (they share the eventID). Without it the server copy has no
      // dedupe key. (The Lead event sets its own eventID in DemoPage.tsx.)
      var _fbPageViewId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'pv-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      fbq('track', 'PageView', {}, { eventID: _fbPageViewId });
    </script>
    <!-- End Meta Pixel -->

    <!-- OpenAI Measurement Pixel stub — SDK loads on window load (see above) -->
    <script>
      window.oaiq = window.oaiq || function () {
        (window.oaiq.q = window.oaiq.q || []).push(arguments);
      };
      oaiq("init", { pixelId: "TRAFb9UzfmGsmZ4fxHfy5q" });
    </script>
    <!-- End OpenAI Measurement Pixel stub -->
    <!-- ANALYTICS:END -->
  </head>
